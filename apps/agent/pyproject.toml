[project]
name = "dev-doctor"
version = "0.1.0"
description = "Agent khusus debugging, koding, website, dan jaringan"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mistralai-agents[koyeb]>=1.1.2,<1.2",
]

[tool.mistralai.agents]
entrypoint = "main:agent"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
